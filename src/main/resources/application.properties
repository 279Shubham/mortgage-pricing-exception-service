spring.application.name=pricing-exception-service
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:pricing;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=2000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
pricing.discount.min-bps=1
pricing.discount.max-bps=200
pricing.advice.high-discount-bps=50
pricing.advice.min-reason-length=30
pricing.idempotency.ttl=24h
